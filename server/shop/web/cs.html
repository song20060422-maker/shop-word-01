<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOP·OS · 客服退款</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#fff; --panel2:#fff; --line:#e3e8f0;
  --tx:#1f2937; --mut:#6b7280; --dim:#9ca3af;
  --amber:#2f54eb; --ok:#15803d; --err:#b91c1c; --info:#2f54eb; --warn:#b45309;
  --mono:ui-monospace,'Cascadia Code',Consolas,monospace;
  --serif:system-ui,'Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:13px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}
header{background:#111827;color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:600;color:#fff;letter-spacing:.5px}
.brand small{color:#9ca3af;font-size:12px;margin-left:8px;font-weight:400;letter-spacing:0}
.hctrl{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap;font-size:12px}
select,input{background:#fff;color:#1f2937;border:1px solid #cbd5e1;border-radius:6px;padding:5px 8px;font:12px system-ui}
select:focus,input:focus{outline:2px solid rgba(47,84,235,.22);border-color:var(--amber)}
.plabel{color:#9ca3af;font-size:12px}
nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto;position:sticky;top:0;z-index:30}
nav::-webkit-scrollbar{height:0}
nav a{color:#6b7280;padding:9px 15px;font-size:13px;cursor:pointer;text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
nav a:hover{color:#374151}
nav a.on{color:#2f54eb;border-bottom-color:#2f54eb;font-weight:600}
main{padding:14px;max-width:1240px;margin:0 auto}
h2{font-size:13.5px;font-weight:600;margin-bottom:8px}
.sec{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 7px;border-bottom:1px solid #eef2f8;text-align:left;vertical-align:top;font-size:12.5px}
th{background:#f8fafc;color:#6b7280;font-weight:600;white-space:nowrap}
tr:hover td{background:#fbfcff}
.num{font-family:var(--mono);font-size:12.5px}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;color:#fff;font-size:11px;line-height:1.7;border:1px solid transparent;white-space:nowrap}
.c-wait{background:#b45309;border-color:#b45309}
.c-paid{background:#2f54eb;border-color:#2f54eb}
.c-ship{background:#0f766e;border-color:#0f766e}
.c-err{background:#b91c1c;border-color:#b91c1c}
.c-ref{background:#7c3aed;border-color:#7c3aed}
.c-dim{background:#6b7280;border-color:#6b7280}
.btn{background:#fff;color:#1f2937;border:1px solid #cbd5e1;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:.15s}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.ok{border-color:#15803d;color:#15803d}.btn.ok:hover{background:#f0fdf4}
.btn.err{border-color:#b91c1c;color:#b91c1c}.btn.err:hover{background:#fef2f2}
.btn.warn{border-color:#b45309;color:#b45309}.btn.warn:hover{background:#fffbeb}
.btn.sm{padding:2px 8px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line);color:#9ca3af}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi>div{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:112px}
.kpi .v{display:block;font-family:var(--mono);font-size:18px;color:var(--amber)}
.kpi .l{font-size:11.5px;color:var(--mut)}
.muted{color:var(--mut);font-size:12px}
#toasts{position:fixed;right:16px;top:14px;z-index:99;display:flex;flex-direction:column;gap:8px;max-width:440px}
.toast{background:#111827;color:#fff;border-radius:8px;padding:9px 14px;font-size:12.5px;animation:tin .2s;box-shadow:0 6px 20px rgba(15,23,42,.18)}
.toast.ok{background:#15803d}.toast.err{background:#7f1d1d}.toast.warn{background:#b45309}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
.loginbox{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div class="brand">SHOP·OS <small>客服退款 · 独立后台页（GVA 接口）</small></div>
  <div class="hctrl loginbox" id="loginBox">
    <span class="plabel">客服账号（cs1 / admin）</span>
    <input id="u" value="admin" size="8" placeholder="用户名">
    <input id="p" type="password" value="123456" size="8" placeholder="密码">
    <button class="btn" onclick="doLogin()">登录</button>
  </div>
  <div class="hctrl" id="userBox" style="display:none">
    <span class="chip c-ref" id="who"></span>
    <button class="btn sm" onclick="logout()">退出</button>
  </div>
</header>
<nav>
  <a href="/shop" target="_blank">买家端</a>
  <a href="/ops" target="_blank">运营核查</a>
  <a href="/warehouse" target="_blank">仓库发货</a>
  <a href="/cs" class="on">客服退款</a>
</nav>
<main>
  <div class="sec">
    <h2>模拟渠道状态（复现「首次失败、再次成功」）</h2>
    <div class="row kpi" id="chStat"></div>
    <div class="row" style="margin-top:10px">
      <span class="plabel">切换退款结果</span>
      <select id="modeSel" onchange="setMode(this.value)">
        <option value="success">success（退款成功）</option>
        <option value="fail">fail（首次失败 → 可重试）</option>
      </select>
    </div>
  </div>

  <div class="sec">
    <h2>退款审核（同意后调渠道；失败保留记录可重试；申请期间发货暂停）</h2>
    <table id="rfTbl">
      <thead><tr><th>退款单</th><th>订单</th><th>金额</th><th>审核</th><th>渠道</th><th>重试</th><th>原因</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="sec">
    <h2>异常收款（迟到支付，核实后发起退款）</h2>
    <table id="abTbl">
      <thead><tr><th>交易号</th><th>订单</th><th>金额</th><th>状态</th><th>原因</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="sec">
    <h2>支付通知处理记录（只增不改）</h2>
    <table id="ntTbl">
      <thead><tr><th>订单</th><th>交易号</th><th>金额</th><th>验签</th><th>结果</th><th>原因</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>
<div id="toasts"></div>

<script>
const API='/gva';
const TOKEN_KEY='gva_token_cs';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fen(c){return ((c||0)/100).toFixed(2)}
function fmt(t){return t?String(t).replace('T',' ').slice(0,19):''}
function toast(msg,cls){const d=document.createElement('div');d.className='toast '+(cls||'');d.textContent=msg;
  document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),3800)}
function tag(s){const g={approved:'c-ship',refunded:'c-ship',handled:'c-ship',success:'c-ship',accepted:'c-ship',
  pending:'c-wait',processing:'c-wait',abnormal:'c-wait',failed:'c-err',rejected:'c-err'}[s]||'c-dim';
  return `<span class="chip ${g}">${esc(s)}</span>`}

const ROLE={id:9003,label:'客服'};
const SUPER_ROLES=[888,9528];
let token=localStorage.getItem(TOKEN_KEY)||'';
function setToken(t,keep,who,aid){token=t||'';
  if(keep){localStorage.setItem(TOKEN_KEY,t);if(who)localStorage.setItem(TOKEN_KEY+'_who',who);if(aid)localStorage.setItem(TOKEN_KEY+'_aid',String(aid))}
  else{localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(TOKEN_KEY+'_who');localStorage.removeItem(TOKEN_KEY+'_aid')}
  document.getElementById('loginBox').style.display=token?'none':'flex';
  document.getElementById('userBox').style.display=token?'flex':'none';
  if(token)document.getElementById('who').textContent='已登录：'+(localStorage.getItem(TOKEN_KEY+'_who')||'缓存凭证');}
async function api(path,opt){
  const o=Object.assign({headers:{}},opt||{});
  o.headers['x-token']=token;
  const r=await fetch(API+path,o);
  const j=await r.json().catch(()=>({code:-1,msg:'响应解析失败'}));
  if(j.code!==0){
    if(j.data&&(j.data.refundNo||j.data.channelTxnId))return j.data; // 审核已生效但渠道失败：仍返回退款单
    if(r.status===401||j.code===7||j.code===700){setToken('');toast('登录已失效，请重新登录','err');throw new Error(j.msg||'未登录')}
    if(r.status===403){toast('当前账号无'+ROLE.label+'权限','err');throw new Error(j.msg||'无权限')}
    throw new Error(j.msg||('code='+j.code));
  }
  return j.data;
}
async function doLogin(){
  const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
  try{
    const r=await fetch(API+'/base/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const j=await r.json();
    if(j.code!==0){toast('登录失败：'+(j.msg||''),'err');return}
    const user=(j.data&&j.data.user)||{};
    const aid=Number(user.authorityId||0);
    if(aid!==ROLE.id&&SUPER_ROLES.indexOf(aid)<0){
      const an=(user.authority&&user.authority.authorityName)||aid;
      toast('账号「'+u+'」的角色是「'+an+'」，无权进入'+ROLE.label+'页；请用 '+ROLE.label+'账号（如 cs1）或管理员登录','err');
      return;
    }
    const an=(user.authority&&user.authority.authorityName)||'管理员';
    setToken(j.data.token,true,(user.nickName||u)+'（'+an+'）',aid);
    toast('登录成功','ok');refresh();
  }catch(e){toast('登录请求失败：'+e.message,'err')}
}
function logout(){setToken('');toast('已退出')}

async function loadChannel(){
  // 渠道状态走买家端同源公开接口（GET /api/pay/channel），不经过 GVA；
  // channel/mode 是设置接口，只在用户主动切换时才调用。
  try{const r=await fetch('/api/pay/channel');const d=await r.json();
    renderChannel({refundMode:d.refundMode||d.refund_mode,refundCalls:d.refundCalls??d.refund_calls});
  }catch(e){
    document.getElementById('chStat').innerHTML='<div class="muted">渠道状态获取失败</div>';
  }
}
function renderChannel(d){
  if(!d)return;
  document.getElementById('modeSel').value=d.refundMode||'success';
  document.getElementById('chStat').innerHTML=
    `<div><div class="v">${esc(d.refundMode||'-')}</div><div class="l">当前退款结果</div></div>`+
    `<div><div class="v">${d.refundCalls??0}</div><div class="l">渠道调用次数</div></div>`;
}
async function setMode(m){
  try{const d=await api('/shop/cs/channel/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refundMode:m})});
    renderChannel(d);toast('渠道退款结果已切换为 '+m,'ok');
  }catch(e){toast(e.message,'err')}
}

async function loadRefunds(){
  try{const list=(await api('/shop/cs/refunds'))||[];
    const tb=document.querySelector('#rfTbl tbody');tb.innerHTML='';
    list.forEach(r=>{const tr=document.createElement('tr');
      let act='';
      if(r.auditStatus==='pending')act=`<button class="btn sm ok" onclick="audit('${esc(r.orderNo)}',true)">同意</button> `+
        `<button class="btn sm err" onclick="audit('${esc(r.orderNo)}',false)">拒绝</button>`;
      if(r.auditStatus==='approved'&&r.channelStatus==='failed')act=`<button class="btn sm warn" onclick="retry('${esc(r.refundNo)}')">重试退款</button>`;
      tr.innerHTML=`<td class="num">${esc(r.refundNo)}</td><td class="num">${esc(r.orderNo)}</td>`+
        `<td class="num">¥${fen(r.amountCents)}</td><td>${tag(r.auditStatus)}</td><td>${tag(r.channelStatus)}</td>`+
        `<td class="num">${r.retryCount||0}</td><td class="muted">${esc(r.auditReason||'')}</td><td>${act}</td>`;
      tb.appendChild(tr)});
    if(!list.length)tb.innerHTML='<tr><td colspan="8" class="muted" style="text-align:center;padding:18px">暂无退款单</td></tr>';
  }catch(e){}
}
async function audit(orderNo,approve){
  // 取消（null）必须中止，不能被默认原因兜底成"已审核"；原因必填（后端同时强校验）
  const input=prompt(approve?'审核意见（必填，将记入处理记录）':'拒绝原因（必填）',approve?'同意整单退款':'发货在即，不同意退款');
  if(input===null)return;
  const reason=String(input).trim();
  if(!reason){toast('必须填写审核原因','warn');return}
  try{const rf=await api('/shop/cs/refunds/audit',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({orderNo,approve,reason})});
    if(rf&&rf.channelStatus==='failed')toast('审核已生效，但渠道退款失败，可重试','warn');
    else toast('审核完成','ok');
    refresh();
  }catch(e){toast(e.message,'err')}
}
async function retry(refundNo){
  try{const rf=await api('/shop/cs/refunds/retry',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({refundNo})});
    if(rf&&rf.channelStatus==='failed')toast('重试仍失败，可再次重试','warn');
    else toast('渠道退款成功','ok');
    refresh();
  }catch(e){toast(e.message,'err')}
}

async function loadAbnormals(){
  try{const list=(await api('/shop/cs/abnormals'))||[];
    const tb=document.querySelector('#abTbl tbody');tb.innerHTML='';
    list.forEach(a=>{const tr=document.createElement('tr');
      tr.innerHTML=`<td class="num">${esc(a.channelTxnId)}</td><td class="num">${esc(a.orderNo||'-')}</td>`+
        `<td class="num">¥${fen(a.amountCents)}</td><td>${tag(a.status)}</td><td class="muted">${esc(a.reason||'')}</td>`+
        `<td>${a.status==='pending'?`<button class="btn sm warn" onclick="handleAbn('${esc(a.channelTxnId)}')">核实并退款</button>`:''}</td>`;
      tb.appendChild(tr)});
    if(!list.length)tb.innerHTML='<tr><td colspan="6" class="muted" style="text-align:center;padding:18px">暂无异常收款</td></tr>';
  }catch(e){}
}
async function handleAbn(txn){
  const input=prompt('核实说明（必填，将作为退款原因）','核实为订单关闭后到达的支付，发起退款');
  if(input===null)return;
  const reason=String(input).trim();
  if(!reason){toast('必须填写核实说明','warn');return}
  try{await api('/shop/cs/abnormals/handle',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({channelTxnId:txn,reason})});
    toast('已发起退款','ok');refresh();
  }catch(e){toast(e.message,'err')}
}

async function loadNotices(){
  try{const list=(await api('/shop/cs/notices?limit=60'))||[];
    const tb=document.querySelector('#ntTbl tbody');tb.innerHTML='';
    list.slice().reverse().forEach(n=>{const tr=document.createElement('tr');
      tr.innerHTML=`<td class="num">${esc(n.orderNo||'-')}</td><td class="num">${esc(n.channelTxnId)}</td>`+
        `<td class="num">¥${fen(n.amountCents)}</td><td>${n.signOk?'<span class="chip c-ship">通过</span>':'<span class="chip c-err">失败</span>'}</td>`+
        `<td>${tag(n.result)}</td><td class="muted">${esc(n.reason||'')}</td>`;
      tb.appendChild(tr)});
    if(!list.length)tb.innerHTML='<tr><td colspan="6" class="muted" style="text-align:center;padding:14px">暂无通知</td></tr>';
  }catch(e){}
}

function refresh(){if(!token)return;loadRefunds();loadAbnormals();loadNotices();loadChannel()}
// 缓存凭证也要校验角色：换账号登录过别的页时，不能凭旧 token 直接进来
(function boot(){
  const cachedAid=Number(localStorage.getItem(TOKEN_KEY+'_aid')||0);
  if(token&&cachedAid&&cachedAid!==ROLE.id&&SUPER_ROLES.indexOf(cachedAid)<0){
    setToken('');toast('缓存账号无权进入'+ROLE.label+'页，请重新登录','warn');return;
  }
  setToken(token,token?true:false);
  if(token)refresh();
})();
</script>
</body>
</html>
