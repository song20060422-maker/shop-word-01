<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOP·OS · 运营核查</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#fff; --panel2:#fff; --line:#e3e8f0;
  --tx:#1f2937; --mut:#6b7280; --dim:#9ca3af;
  --amber:#2f54eb; --ok:#15803d; --err:#b91c1c; --info:#2f54eb; --warn:#b45309;
  --mono:ui-monospace,'Cascadia Code',Consolas,monospace;
  --serif:system-ui,'Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:13px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}
header{background:#111827;color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:600;color:#fff;letter-spacing:.5px}
.brand small{color:#9ca3af;font-size:12px;margin-left:8px;font-weight:400;letter-spacing:0}
.hctrl{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap;font-size:12px}
select,input{background:#fff;color:#1f2937;border:1px solid #cbd5e1;border-radius:6px;padding:5px 8px;font:12px system-ui}
select:focus,input:focus{outline:2px solid rgba(47,84,235,.22);border-color:var(--amber)}
.plabel{color:#9ca3af;font-size:12px}
nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto;position:sticky;top:0;z-index:30}
nav::-webkit-scrollbar{height:0}
nav a{color:#6b7280;padding:9px 15px;font-size:13px;cursor:pointer;text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
nav a:hover{color:#374151}
nav a.on{color:#2f54eb;border-bottom-color:#2f54eb;font-weight:600}
main{padding:14px;max-width:1240px;margin:0 auto}
h2{font-size:13.5px;font-weight:600;margin-bottom:8px}
.sec{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 7px;border-bottom:1px solid #eef2f8;text-align:left;vertical-align:top;font-size:12.5px}
th{background:#f8fafc;color:#6b7280;font-weight:600;white-space:nowrap}
tr:hover td{background:#fbfcff}
.num{font-family:var(--mono);font-size:12.5px}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;color:#fff;font-size:11px;line-height:1.7;border:1px solid transparent;white-space:nowrap}
.c-wait{background:#b45309;border-color:#b45309}
.c-paid{background:#2f54eb;border-color:#2f54eb}
.c-ship{background:#0f766e;border-color:#0f766e}
.c-err{background:#b91c1c;border-color:#b91c1c}
.c-ref{background:#7c3aed;border-color:#7c3aed}
.c-dim{background:#6b7280;border-color:#6b7280}
.btn{background:#fff;color:#1f2937;border:1px solid #cbd5e1;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:.15s}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.ok{border-color:#15803d;color:#15803d}.btn.ok:hover{background:#f0fdf4}
.btn.err{border-color:#b91c1c;color:#b91c1c}.btn.err:hover{background:#fef2f2}
.btn.sm{padding:2px 8px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line);color:#9ca3af}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi>div{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:112px}
.kpi .v{display:block;font-family:var(--mono);font-size:18px;color:var(--amber)}
.kpi .l{font-size:11.5px;color:var(--mut)}
.muted{color:var(--mut);font-size:12px}
#toasts{position:fixed;right:16px;top:14px;z-index:99;display:flex;flex-direction:column;gap:8px;max-width:440px}
.toast{background:#111827;color:#fff;border-radius:8px;padding:9px 14px;font-size:12.5px;animation:tin .2s;box-shadow:0 6px 20px rgba(15,23,42,.18)}
.toast.ok{background:#15803d}.toast.err{background:#7f1d1d}.toast.warn{background:#b45309}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
#mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 12px}
#mask.on{display:flex}
#dlg{background:#fff;border-radius:10px;max-width:860px;width:100%;padding:16px 18px;box-shadow:0 10px 30px rgba(15,23,42,.2)}
#dlg h3{font-size:14px;margin-bottom:10px;color:#1f2937}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--mut)}.kv dd{font-family:var(--mono);font-size:12.5px}
.loginbox{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ev{font-family:var(--mono);font-size:12px;color:var(--mut);padding:2px 0}
</style>
</head>
<body>
<header>
  <div class="brand">SHOP·OS <small>运营核查 · 独立后台页（GVA 接口）</small></div>
  <div class="hctrl loginbox" id="loginBox">
    <span class="plabel">运营账号（ops1 / admin）</span>
    <input id="u" value="admin" size="8" placeholder="用户名">
    <input id="p" type="password" value="123456" size="8" placeholder="密码">
    <button class="btn" onclick="doLogin()">登录</button>
  </div>
  <div class="hctrl" id="userBox" style="display:none">
    <span class="chip c-ok" id="who"></span>
    <button class="btn sm" onclick="logout()">退出</button>
  </div>
</header>
<nav>
  <a href="/shop" target="_blank">买家端</a>
  <a href="/ops" class="on">运营核查</a>
  <a href="/warehouse" target="_blank">仓库发货</a>
  <a href="/cs" target="_blank">客服退款</a>
</nav>
<main>
  <div class="sec">
    <h2>交易汇总</h2>
    <div class="kpi" id="kpi"></div>
  </div>

  <div class="sec">
    <h2>商品与库存（可售 = 初始库存 - 未释放占用；改价不影响已有订单金额）</h2>
    <table id="prodTbl">
      <thead><tr><th>SKU</th><th>商品</th><th>单价(分)</th><th>可售</th><th>初始</th><th>在售</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="sec">
    <h2>订单核查 <span class="plabel" style="margin-left:12px">状态</span>
      <select id="stSel" onchange="loadOrders()">
        <option value="">全部</option>
        <option value="pending_payment">待付款</option><option value="paid">待发货</option>
        <option value="shipped">已发货</option><option value="refund_requested">退款申请中</option>
        <option value="refunding">退款处理中</option><option value="refunded">已退款</option>
        <option value="cancelled">已取消</option><option value="closed">已关闭</option>
      </select>
    </h2>
    <table id="orderTbl">
      <thead><tr><th>订单号</th><th>买家</th><th>商品</th><th>数量</th><th>金额</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div class="sec">
      <h2>库存流水（占用/释放/恢复守恒）</h2>
      <table id="ledgerTbl">
        <thead><tr><th>商品</th><th>订单</th><th>类型</th><th>变动</th><th>结余</th><th>时间</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="sec">
      <h2>支付通知记录（含失败通知，只增不改）</h2>
      <table id="noticeTbl">
        <thead><tr><th>订单</th><th>交易号</th><th>金额</th><th>验签</th><th>结果</th><th>原因</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>
<div id="mask" onclick="if(event.target===this)closeDlg()"><div id="dlg"></div></div>
<div id="toasts"></div>

<script>
const API='/gva';
const ST={pending_payment:['待付款','c-wait'],paid:['待发货','c-paid'],shipped:['已发货','c-ship'],
  cancelled:['已取消','c-dim'],closed:['已关闭','c-dim'],refund_requested:['退款申请中','c-ref'],
  refunding:['退款处理中','c-ref'],refunded:['已退款','c-ref']};
const TOKEN_KEY='gva_token_ops';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fen(c){return ((c||0)/100).toFixed(2)}
function fmt(t){return t?String(t).replace('T',' ').slice(0,19):''}
function toast(msg,cls){const d=document.createElement('div');d.className='toast '+(cls||'');d.textContent=msg;
  document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),3800)}
function chip(st){const m=ST[st];return `<span class="chip ${m?m[1]:'c-dim'}">${m?m[0]:esc(st)}</span>`}

const ROLE={id:9001,label:'运营'};
const SUPER_ROLES=[888,9528];
let token=localStorage.getItem(TOKEN_KEY)||'';
function setToken(t,keep,who,aid){token=t||'';
  if(keep){localStorage.setItem(TOKEN_KEY,t);if(who)localStorage.setItem(TOKEN_KEY+'_who',who);if(aid)localStorage.setItem(TOKEN_KEY+'_aid',String(aid))}
  else{localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(TOKEN_KEY+'_who');localStorage.removeItem(TOKEN_KEY+'_aid')}
  document.getElementById('loginBox').style.display=token?'none':'flex';
  document.getElementById('userBox').style.display=token?'flex':'none';
  if(token)document.getElementById('who').textContent='已登录：'+(localStorage.getItem(TOKEN_KEY+'_who')||'缓存凭证');}
function logged(){return !!token}

async function api(path,opt){
  const o=Object.assign({headers:{}},opt||{});
  o.headers['x-token']=token;
  const r=await fetch(API+path,o);
  const j=await r.json().catch(()=>({code:-1,msg:'响应解析失败'}));
  if(j.code!==0){if(r.status===401||j.code===7||j.code===700){setToken('');toast('登录已失效，请重新登录','err');throw new Error(j.msg||'未登录')}
    if(r.status===403||j.code===7){toast('当前账号无'+ROLE.label+'权限','err');throw new Error(j.msg||'无权限')}
    throw new Error(j.msg||('code='+j.code))}
  return j.data;
}
async function doLogin(){
  const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
  try{
    const r=await fetch(API+'/base/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const j=await r.json();
    if(j.code!==0){toast('登录失败：'+(j.msg||''),'err');return}
    const user=(j.data&&j.data.user)||{};
    const aid=Number(user.authorityId||0);
    if(aid!==ROLE.id&&SUPER_ROLES.indexOf(aid)<0){
      const an=(user.authority&&user.authority.authorityName)||aid;
      toast('账号「'+u+'」的角色是「'+an+'」，无权进入'+ROLE.label+'页；请用 '+ROLE.label+'账号（如 ops1）或管理员登录','err');
      return;
    }
    const an=(user.authority&&user.authority.authorityName)||'管理员';
    setToken(j.data.token,true,(user.nickName||u)+'（'+an+'）',aid);
    toast('登录成功','ok');refresh();
  }catch(e){toast('登录请求失败：'+e.message,'err')}
}
function logout(){setToken('');toast('已退出');}

async function loadSummary(){
  try{const s=await api('/shop/ops/summary');
    const net=(s.totalPaidCents||0)-(s.totalRefundedCents||0);
    document.getElementById('kpi').innerHTML=
      `<div><div class="v">${s.orderCount||0}</div><div class="l">订单总数</div></div>`+
      `<div><div class="v">¥${fen(s.totalPaidCents)}</div><div class="l">已收款</div></div>`+
      `<div><div class="v">¥${fen(s.totalRefundedCents)}</div><div class="l">已退款</div></div>`+
      `<div><div class="v">¥${fen(net)}</div><div class="l">净收款</div></div>`;
  }catch(e){document.getElementById('kpi').innerHTML='<div class="muted">'+esc(e.message)+'</div>'}
}

async function loadProducts(){
  try{const list=await api('/shop/ops/products')||[];
    const tb=document.querySelector('#prodTbl tbody');tb.innerHTML='';
    list.forEach(p=>{const tr=document.createElement('tr');
      tr.innerHTML=`<td class="num">${esc(p.id)}</td><td>${esc(p.name)}</td>`+
        `<td><input class="num" style="width:90px" value="${p.priceCents}" data-f="price" data-id="${p.id}"></td>`+
        `<td><input class="num" style="width:70px" value="${p.available}" data-f="available" data-id="${p.id}"></td>`+
        `<td class="num">${p.initialStock??'-'}</td>`+
        `<td>${p.onSale?'<span class="chip c-ship">在售</span>':'<span class="chip c-dim">下架</span>'}</td>`+
        `<td><button class="btn sm" onclick="saveProduct(${p.id},this)">保存</button> `+
        `<button class="btn sm ${p.onSale?'err':'ok'}" onclick="toggleSale(${p.id},${!p.onSale})">${p.onSale?'下架':'上架'}</button></td>`;
      tb.appendChild(tr)});
  }catch(e){}
}
async function saveProduct(id,btn){
  const price=Number(document.querySelector(`input[data-f="price"][data-id="${id}"]`).value);
  const available=Number(document.querySelector(`input[data-f="available"][data-id="${id}"]`).value);
  if(!(price>0)||!(available>=0)){toast('单价与可售需为合法数字','warn');return}
  try{await api('/shop/ops/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({priceCents:price,available})});toast('已保存（priceCents='+price+'，available='+available+'）','ok');refresh()}
  catch(e){toast(e.message,'err')}
}
async function toggleSale(id,onSale){
  try{await api('/shop/ops/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({onSale})});toast(onSale?'已上架':'已下架','ok');refresh()}
  catch(e){toast(e.message,'err')}
}

async function loadOrders(){
  const st=document.getElementById('stSel').value;
  try{const list=(await api('/shop/ops/orders'+(st?'?status='+st:'')))||[];
    const tb=document.querySelector('#orderTbl tbody');tb.innerHTML='';
    list.forEach(o=>{const tr=document.createElement('tr');
      tr.innerHTML=`<td class="num">${esc(o.orderNo)}</td><td class="num">${o.buyerId??'-'}</td>`+
        `<td>${esc(o.productName||'')}</td><td class="num">${o.qty}</td><td class="num">¥${fen(o.amountCents)}</td>`+
        `<td>${chip(o.status)}</td><td class="num">${fmt(o.createdAt)}</td>`+
        `<td><button class="btn sm" onclick="trace('${o.orderNo}')">核查</button></td>`;
      tb.appendChild(tr)});
    if(!list.length)tb.innerHTML='<tr><td colspan="8" class="muted" style="text-align:center;padding:18px">暂无数据</td></tr>';
  }catch(e){}
}

async function trace(no){
  try{const d=await api('/shop/ops/orders/'+encodeURIComponent(no));
    const o=d.order||{},rf=d.refund,ab=d.abnormal||[],ns=d.notices||[];
    let h=`<h3>订单全链路核查 · ${esc(no)}</h3><dl class="kv">`+
      `<dt>状态</dt><dd>${chip(o.status)}</dd><dt>商品</dt><dd>${esc(o.productName||'')} × ${o.qty}</dd>`+
      `<dt>金额</dt><dd>¥${fen(o.amountCents)}</dd><dt>创建</dt><dd>${fmt(o.createdAt)}</dd>`+
      `<dt>付款截止</dt><dd>${fmt(o.payDeadline||'')}</dd></dl>`;
    if(rf)h+=`<h4 style="margin:12px 0 6px">退款：${esc(rf.refundNo)}（审核 ${esc(rf.auditStatus)} / 渠道 ${esc(rf.channelStatus)} / 重试 ${rf.retryCount||0}）</h4>`;
    if(ab.length)h+=`<h4 style="margin:12px 0 6px">异常收款</h4>`+ab.map(a=>`<div class="ev">${esc(a.channelTxnId)} · ¥${fen(a.amountCents)} · ${esc(a.status)} · ${esc(a.reason||'')}</div>`).join('');
    if(ns.length)h+=`<h4 style="margin:12px 0 6px">支付通知</h4>`+ns.map(n=>`<div class="ev"><b>${fmt(n.createdAt)}</b> ${esc(n.channelTxnId)} ${n.amountCents}分 验签${n.signOk?'通过':'失败'} → ${esc(n.result)} ${esc(n.reason||'')}</div>`).join('');
    document.getElementById('dlg').innerHTML=h;
    document.getElementById('mask').classList.add('on');
  }catch(e){toast(e.message,'err')}
}
function closeDlg(){document.getElementById('mask').classList.remove('on')}

async function loadLedger(){
  try{const list=(await api('/shop/ops/ledger'))||[];
    const tb=document.querySelector('#ledgerTbl tbody');tb.innerHTML='';
    list.slice(-60).reverse().forEach(l=>{const tr=document.createElement('tr');
      tr.innerHTML=`<td class="num">${l.productId}</td><td class="num">${esc(l.orderNo||'-')}</td>`+
        `<td>${esc(l.changeType)}</td><td class="num">${l.delta>0?'+':''}${l.delta}</td>`+
        `<td class="num">${l.availableAfter}</td><td class="num">${fmt(l.createdAt)}</td>`;
      tb.appendChild(tr)});
    if(!list.length)tb.innerHTML='<tr><td colspan="6" class="muted" style="text-align:center;padding:14px">暂无流水</td></tr>';
  }catch(e){}
}
async function loadNotices(){
  try{const list=(await api('/shop/ops/notices?limit=60'))||[];
    const tb=document.querySelector('#noticeTbl tbody');tb.innerHTML='';
    list.slice().reverse().forEach(n=>{const tr=document.createElement('tr');
      tr.innerHTML=`<td class="num">${esc(n.orderNo||'-')}</td><td class="num">${esc(n.channelTxnId)}</td>`+
        `<td class="num">¥${fen(n.amountCents)}</td><td>${n.signOk?'<span class="chip c-ship">通过</span>':'<span class="chip c-err">失败</span>'}</td>`+
        `<td>${chipNotice(n.result)}</td><td class="muted">${esc(n.reason||'')}</td>`;
      tb.appendChild(tr)});
    if(!list.length)tb.innerHTML='<tr><td colspan="6" class="muted" style="text-align:center;padding:14px">暂无通知</td></tr>';
  }catch(e){}
}
function chipNotice(r){const m={accepted:['受理','c-ship'],duplicated:['重复','c-paid'],abnormal:['异常','c-wait'],rejected:['拒绝','c-err']};
  const x=m[r]||[r,'c-dim'];return `<span class="chip ${x[1]}">${esc(x[0])}</span>`}

function refresh(){if(!logged())return;loadSummary();loadProducts();loadOrders();loadLedger();loadNotices()}
// 缓存凭证也要校验角色：换账号登录过别的页时，不能凭旧 token 直接进来
(function boot(){
  const cachedAid=Number(localStorage.getItem(TOKEN_KEY+'_aid')||0);
  if(token&&cachedAid&&cachedAid!==ROLE.id&&SUPER_ROLES.indexOf(cachedAid)<0){
    setToken('');toast('缓存账号无权进入'+ROLE.label+'页，请重新登录','warn');return;
  }
  setToken(token,token?true:false);
  if(token)refresh();
})();
</script>
</body>
</html>
