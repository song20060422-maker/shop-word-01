# Shop 买家端独立服务（server/cmd/shop）容器配置
# 与 GVA 管理端共用同一个 gva 数据库（gva 框架表 + shop 业务 11 张表）。
system:
    addr: ":8099"
    mode: release
    # 后台独立页（/ops /warehouse /cs）经本服务 /gva/* 反代调用 GVA 管理端（compose 服务名 admin）
    admin-target: "http://admin:8099"
mysql:
    dsn: "root:root@tcp(mysql:3306)/gva?charset=utf8mb4&parseTime=True&loc=Local"
    max-idle-conns: 5
    max-open-conns: 20
    log-mode: false
jwt:
    secret: shop-gva-dev-secret
    expire-hours: 12
shop:
    order-timeout-minutes: 10
    pay-notify-secret: channel-shared-secret
    demo-password: shop123
    demo-mode: true
channel:
    refund-mode: success
