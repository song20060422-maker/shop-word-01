# Shop 买家端独立 Gin 服务配置（非后台管理页面）
# 启动：cd server && go run ./cmd/shop -c config.shop.yaml
# 环境变量覆盖：SHOP_DSN / SHOP_ADDR / SHOP_MODE / SHOP_JWT_SECRET / SHOP_PAY_SECRET
system:
    addr: ":8090"
    mode: debug
mysql:
    # 业务表统一放在 gva 库（gva 框架表 + shop 业务 11 张表）
    dsn: "root:root@tcp(127.0.0.1:3307)/gva?charset=utf8mb4&parseTime=True&loc=Local"
    max-idle-conns: 5
    max-open-conns: 20
    log-mode: false
jwt:
    secret: shop-gva-dev-secret
    expire-hours: 12
shop:
    order-timeout-minutes: 10
    pay-notify-secret: channel-shared-secret
    demo-password: shop123
    demo-mode: true
    # 支付渠道：simulated（默认，模拟渠道）| alipay（支付宝沙箱真实渠道，演示扩展）
    pay-channel: alipay
    alipay:
        app-id: "9021000158651669"
        private-key: ""
        alipay-public-key: ""
        # cpolar 隧道地址（重启会变，需同步支付宝沙箱后台的授权回调地址）
        notify-url: "http://525265d8.r9.cpolar.cn/api/pay/alipay/notify"
        return-url: "http://127.0.0.1:8090/shop"
channel:
    refund-mode: success
