name: shop-ci

# Shop 商城小型交易系统质量门禁（题目 01）
# 触发：推送到任意分支 / 针对 main 的 PR
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: shop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 质量门禁（gofmt / vet / build / test / 覆盖率 / race）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shop_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 依赖下载
        run: go mod download

      - name: gofmt 格式检查（自研代码）
        run: |
          out=$(gofmt -l shop initialize/router_biz.go)
          if [ -n "$out" ]; then
            echo "以下文件不符合 gofmt（需统一 LF + 标准格式）："
            echo "$out"
            exit 1
          fi

      - name: go vet（自研代码）
        run: go vet ./shop/...

      - name: 编译全仓
        run: go build ./...

      - name: 单元测试 + 集成测试 + 覆盖率
        env:
          SHOP_TEST_DSN: ""
        run: |
          # 各测试包共用 shop_test 单一测试库，须 -p 1 串行执行避免互相清表
          go test -p 1 ./shop/... -count=1 -coverprofile=coverage.out -coverpkg=./shop/...

      - name: 覆盖率阈值（≥85%）
        run: |
          go tool cover -func=coverage.out | tee coverage-func.txt
          total=$(tail -1 coverage-func.txt | awk '{print $3}' | tr -d '%')
          echo "总覆盖率: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 85) { printf "覆盖率不足：%s%% < 85%%\n", t; exit 1 } }'

      - name: 并发路径 race 检测
        run: |
          go test -race -p 1 ./shop/service ./shop/router -count=1 \
            -run 'Concurrent|Race|Notify|Refund|Ship|LatePayment'

      - name: 冒烟（买家端独立服务 + GVA 管理端）
        run: |
          # 业务表统一在 gva 库（gva 框架表 + shop 业务表），先确保库存在
          cid=$(docker ps --format '{{.Names}}' | grep -i mysql | head -n1)
          docker exec "$cid" mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS gva DEFAULT CHARACTER SET utf8mb4;"
          go build -o shop-standalone ./cmd/shop
          go build -o gva-server .
          # 买家端独立 Gin 服务（:8090）
          SHOP_ADDR=":8090" SHOP_DSN="root:root@tcp(127.0.0.1:3307)/gva?charset=utf8mb4&parseTime=True&loc=Local" \
            ./shop-standalone > shop.log 2>&1 &
          # GVA 管理端（:8099，挂 /shop/** 后台接口）
          ./gva-server > server.log 2>&1 &
          ok=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8090/api/health > /dev/null && curl -fsS http://127.0.0.1:8099/health > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "服务 240s 内未就绪，shop.log/server.log 尾部："
            tail -n 60 shop.log || true
            tail -n 80 server.log
            exit 7
          fi
          curl -fsS http://127.0.0.1:8090/api/health
          curl -fsS http://127.0.0.1:8099/health
          BASE=http://127.0.0.1:8090 bash ./scripts/ci-smoke.sh
          grep -i "shop 后台管理路由注册完成" server.log

      - name: 上传测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shop-test-evidence
          path: |
            server/coverage.out
            server/coverage-func.txt
            server/server.log
          if-no-files-found: warn
